server:
  port: 18080

spring:
  application:
    name: rag2agent
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      port: 16379

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:true}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 2592000 # 有效期 30 天
  is-concurrent: true #并发登录
  is-share: false #多次登录是否共享（同账号多设备各自有独立 token）
  token-style: uuid #生成风格（若为tik是雪花算法）
  is-log: false

rag2agent:
  ingest:
    rocketmq-enabled: ${RAG2AGENT_MQ_ENABLED:false}
  search:
    parallel-timeout-millis: ${RAG2AGENT_SEARCH_PARALLEL_TIMEOUT_MILLIS:10000}
    chinese-search-mode: ${RAG2AGENT_CHINESE_SEARCH_MODE:auto}
  cache:
    embedding:
      enabled: ${RAG2AGENT_EMBEDDING_CACHE_ENABLED:true}
      max-entries: ${RAG2AGENT_EMBEDDING_CACHE_MAX_ENTRIES:10000}
      ttl-seconds: ${RAG2AGENT_EMBEDDING_CACHE_TTL_SECONDS:3600}
      model-version: ${RAG2AGENT_EMBEDDING_MODEL_VERSION:v1}
      dimension: ${RAG2AGENT_EMBEDDING_DIMENSION:1024}
  rate-limit:
    enabled: ${RAG2AGENT_RATE_LIMIT_ENABLED:true}
    limit: ${RAG2AGENT_RATE_LIMIT:60}
    window-seconds: ${RAG2AGENT_RATE_LIMIT_WINDOW_SECONDS:60}
    login-failure-limit: ${RAG2AGENT_LOGIN_FAILURE_LIMIT:5}
    login-failure-window-seconds: ${RAG2AGENT_LOGIN_FAILURE_WINDOW_SECONDS:900}
    login-lock-seconds: ${RAG2AGENT_LOGIN_LOCK_SECONDS:900}
  agent:
    context-token-budget: ${RAG2AGENT_CONTEXT_TOKEN_BUDGET:6000}
    max-input-chars: ${RAG2AGENT_MAX_INPUT_CHARS:12000}
    summary-max-chars: ${RAG2AGENT_SUMMARY_MAX_CHARS:1200}
    max-output-tokens: ${RAG2AGENT_MAX_OUTPUT_TOKENS:1024}
    tool-timeout-millis: ${RAG2AGENT_TOOL_TIMEOUT_MILLIS:10000}
  application:
    name: RAG2Agent
    version: 0.1.0-SNAPSHOT
    modules:
      - framework
      - infra-ai
      - rag-core
      - mcp-server
      - bootstrap
  mcp:
    remote:
      enabled: ${RAG2AGENT_MCP_REMOTE_ENABLED:false}
      endpoint: ${RAG2AGENT_MCP_REMOTE_ENDPOINT:http://localhost:19090/mcp}
      token: ${RAG2AGENT_MCP_REMOTE_TOKEN:dev-mcp-token}
      scopes: ${RAG2AGENT_MCP_REMOTE_SCOPES:mcp:read}
  ai:
    cost:
      prices:
        "[deepseek/deepseek-v4-flash]":
          version: ${DEEPSEEK_FLASH_PRICE_VERSION:deepseek-official-2026-09-01-usd}
          currency: ${DEEPSEEK_PRICE_CURRENCY:USD}
          prompt-per-million: ${DEEPSEEK_FLASH_PROMPT_PRICE:0.22}
          completion-per-million: ${DEEPSEEK_FLASH_COMPLETION_PRICE:0.66}
          cache-read-per-million: ${DEEPSEEK_FLASH_CACHE_READ_PRICE:0.007}
          cache-write-per-million: ${DEEPSEEK_FLASH_CACHE_WRITE_PRICE:0}
          peak-multiplier: ${DEEPSEEK_PEAK_PRICE_MULTIPLIER:2}
          peak-windows-utc: "${DEEPSEEK_PEAK_WINDOWS_UTC:01:00-04:00,06:00-10:00}"
          peak-weekdays-only: true
        "[deepseek/deepseek-v4-pro]":
          version: ${DEEPSEEK_PRO_PRICE_VERSION:deepseek-official-2026-09-01-usd}
          currency: ${DEEPSEEK_PRICE_CURRENCY:USD}
          prompt-per-million: ${DEEPSEEK_PRO_PROMPT_PRICE:0.66}
          completion-per-million: ${DEEPSEEK_PRO_COMPLETION_PRICE:1.98}
          cache-read-per-million: ${DEEPSEEK_PRO_CACHE_READ_PRICE:0.022}
          cache-write-per-million: ${DEEPSEEK_PRO_CACHE_WRITE_PRICE:0}
          peak-multiplier: ${DEEPSEEK_PEAK_PRICE_MULTIPLIER:2}
          peak-windows-utc: "${DEEPSEEK_PEAK_WINDOWS_UTC:01:00-04:00,06:00-10:00}"
          peak-weekdays-only: true
        "[siliconflow/BAAI/bge-m3]":
          version: ${SILICONFLOW_BGE_M3_PRICE_VERSION:siliconflow-official-2026-09-01-free}
          currency: ${SILICONFLOW_PRICE_CURRENCY:USD}
          prompt-per-million: ${SILICONFLOW_BGE_M3_PROMPT_PRICE:0}
          completion-per-million: 0
          cache-read-per-million: 0
          cache-write-per-million: 0
        "[siliconflow/BAAI/bge-reranker-v2-m3]":
          version: ${SILICONFLOW_RERANK_PRICE_VERSION:siliconflow-official-2026-09-01-free}
          currency: ${SILICONFLOW_PRICE_CURRENCY:USD}
          prompt-per-million: ${SILICONFLOW_RERANK_PROMPT_PRICE:0}
          completion-per-million: 0
          cache-read-per-million: 0
          cache-write-per-million: 0
    active-chat-provider: ${RAG2AGENT_ACTIVE_CHAT_PROVIDER:deepseek}
    active-embedding-provider: ${RAG2AGENT_ACTIVE_EMBEDDING_PROVIDER:siliconflow}
    active-rerank-provider: ${RAG2AGENT_ACTIVE_RERANK_PROVIDER:siliconflow}
    resilience:
      enabled: ${RAG2AGENT_AI_RESILIENCE_ENABLED:true}
      max-attempts: ${RAG2AGENT_AI_MAX_ATTEMPTS:3}
      initial-backoff-millis: ${RAG2AGENT_AI_INITIAL_BACKOFF_MILLIS:200}
      max-backoff-millis: ${RAG2AGENT_AI_MAX_BACKOFF_MILLIS:2000}
      jitter-ratio: ${RAG2AGENT_AI_JITTER_RATIO:0.2}
      failure-threshold: ${RAG2AGENT_AI_FAILURE_THRESHOLD:5}
      open-state-millis: ${RAG2AGENT_AI_OPEN_STATE_MILLIS:30000}
      max-concurrent-requests: ${RAG2AGENT_AI_MAX_CONCURRENT_REQUESTS:16}
    providers:
      - name: deepseek
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        api-key: ${DEEPSEEK_API_KEY:}
        enabled: true #装配时只找启用的
        capabilities:
          - chat
        chat-model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        chat-model-pro: ${DEEPSEEK_MODEL_PRO:deepseek-v4-pro}
      - name: siliconflow
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${SILICONFLOW_API_KEY:}
        enabled: true
        capabilities:
          - embedding
          - rerank
        embedding-model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
        rerank-model: ${SILICONFLOW_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
