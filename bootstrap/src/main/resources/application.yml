server:
  port: 18080

spring:
  application:
    name: rag2agent
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 2592000 # 有效期 30 天
  is-concurrent: true #并发登录
  is-share: false #多次登录是否共享（同账号多设备各自有独立 token）
  token-style: uuid #生成风格（若为tik是雪花算法）
  is-log: false

rag2agent:
  application:
    name: RAG2Agent
    version: 0.1.0-SNAPSHOT
    modules:
      - framework
      - infra-ai
      - rag-core
      - mcp-server
      - bootstrap
  ai:
    providers:
      - name: deepseek
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        api-key: ${DEEPSEEK_API_KEY:}
        enabled: true #装配时只找启用的
        capabilities:
          - chat
        chat-model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        chat-model-pro: ${DEEPSEEK_MODEL_PRO:deepseek-v4-pro}
      - name: siliconflow
        base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        api-key: ${SILICONFLOW_API_KEY:}
        enabled: true
        capabilities:
          - embedding
          - rerank
        embedding-model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
        rerank-model: ${SILICONFLOW_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
