spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/rag2agent
    username: ${POSTGRES_USER:rag2agent}
    password: ${POSTGRES_PASSWORD:rag2agent}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

rag2agent:
  storage:
    postgres:
      host: localhost
      port: 5432
      database: rag2agent
    minio:
      endpoint: http://localhost:9000 #客户端访问 MinIO 服务的地址，9000程序端口，9001Web端口
      access-key: ${MINIO_ROOT_USER:rag2agent}
      secret-key: ${MINIO_ROOT_PASSWORD:rag2agent-password}
      bucket: rag2agent-documents
