spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/rag2agent
    username: ${POSTGRES_APP_USER:rag2agent_app}
    password: ${POSTGRES_APP_PASSWORD:rag2agent}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 16379
      database: 0

rag2agent:
  storage:
    postgres:
      host: localhost
      port: 5432
      database: rag2agent
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:19000} # 宿主高位端口，容器内仍为 9000
      access-key: ${MINIO_ROOT_USER:rag2agent}
      secret-key: ${MINIO_ROOT_PASSWORD:rag2agent-password}
      bucket: rag2agent-documents
