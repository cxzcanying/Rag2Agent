server:
  port: ${MCP_SERVER_PORT:19090}
spring:
  application:
    name: rag2agent-mcp
rag2agent:
  mcp:
    server:
      enabled: ${MCP_SERVER_ENABLED:true}
      token: ${MCP_SERVER_TOKEN:dev-mcp-token}
      required-scopes: ${MCP_SERVER_REQUIRED_SCOPES:mcp:read}
      token-scopes: ${MCP_SERVER_TOKEN_SCOPES:mcp:read}
      endpoint: ${MCP_SERVER_ENDPOINT:/mcp}
      server-name: ${MCP_SERVER_NAME:rag2agent-mcp}
      server-version: ${MCP_SERVER_VERSION:2.0.0}
      keep-alive-seconds: ${MCP_SERVER_KEEP_ALIVE_SECONDS:30}
      allowed-origins: ${MCP_SERVER_ALLOWED_ORIGINS:http://localhost:*}
      allowed-hosts: ${MCP_SERVER_ALLOWED_HOSTS:localhost:*}
