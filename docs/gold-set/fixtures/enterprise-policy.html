<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>星河科技 2026 年休假与采购制度</title>
</head>
<body>
  <h1>星河科技 2026 年休假与采购制度</h1>
  <p>RAG2Agent 平台由星河科技研发，生产环境使用 PostgreSQL 保存业务数据，使用 Neo4j 保存知识图谱。</p>
  <p>员工年假按职级和工龄确定。制度自 2026 年 1 月 1 日起执行，适用于星河科技全体正式员工。</p>
  <table>
    <caption>正式员工年假标准</caption>
    <thead>
      <tr>
        <th>职级</th>
        <th>工龄不足 5 年</th>
        <th>工龄满 5 年</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>初级工程师</td>
        <td>5 天</td>
        <td>7 天</td>
      </tr>
      <tr>
        <td>高级工程师</td>
        <td>10 天</td>
        <td>12 天</td>
      </tr>
      <tr>
        <td>技术专家</td>
        <td>15 天</td>
        <td>18 天</td>
      </tr>
    </tbody>
  </table>
  <p>采购金额超过 10 万元时，必须由部门负责人和财务负责人共同审批。</p>
</body>
</html>
